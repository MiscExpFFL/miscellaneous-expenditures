name: Assemble MEFFL Wednesday Collector
on:
  push:
    paths:
      - '.github/workflows/build-collector.yml'
      - '.github/collector_parts/part01.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Wednesday collector
        run: |
          cp .github/collector_parts/part01.txt MEFFL_Weekly_Collector.user.js
          cp MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.8.txt
      - name: Syntax check
        run: node --check MEFFL_Weekly_Collector.user.js
      - name: Verify Wednesday contract
        run: |
          grep -q 'MEFFL Weekly Collector — Wednesday' MEFFL_Weekly_Collector.user.js
          grep -q '@version      1.3.8' MEFFL_Weekly_Collector.user.js
          grep -q "mode:'WEDNESDAY'" MEFFL_Weekly_Collector.user.js
          grep -q "workflow:'wednesday-combined'" MEFFL_Weekly_Collector.user.js
      - name: Commit collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898218+github-actions[bot]@users.noreply.github.com"
          git add MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.8.txt
          if git diff --cached --quiet; then
            echo "Collector already current."
            exit 0
          fi
          git commit -m "Refresh Wednesday collector v1.3.8"
          git push
