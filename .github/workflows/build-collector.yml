name: Assemble MEFFL Collector
on:
  push:
    paths:
      - '.github/workflows/build-collector.yml'
      - '.github/collector_parts/**'
      - '.github/transaction_parser.js.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Wednesday collector
        run: |
          cat .github/collector_parts/part*.txt > MEFFL_Weekly_Collector.user.js
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('MEFFL_Weekly_Collector.user.js')
          s=p.read_text()
          s=s.replace('MEFFL Weekly Collector — Tuesday + Thursday','MEFFL Weekly Collector — Wednesday')
          s=s.replace('@version      1.2.1','@version      1.3.5')
          s=s.replace("const VERSION='1.2.1';","const VERSION='1.3.5';")
          s=s.replace('Collect Yahoo Fantasy league data twice a week for Miscellaneous Expenditures, with verified matchup scores, clean lineups, projections, transactions and waiver data.','Collect Yahoo Fantasy league data once each Wednesday after waivers for Miscellaneous Expenditures, combining the prior-week recap with post-waiver rosters, projections and the upcoming-week preview.')
          s=s.replace("const TEAM_ALIASES={'Premature Ejelculators':'Premature Ejleculators'};", "const TEAM_ALIASES={'Premature Ejelculators':'Premature Ejleculators','braddydrinksthebud':'Premature Ejleculators'};")
          s=s.replace("if(!state.targetWeek)state.targetWeek=2;","if(!state.targetWeek)state.targetWeek=2;\n  state.mode='post-mnf'; // internal compatibility: Wednesday uses the full recap + preview collection path")
          s=s.replace("state={...initialState(),mode:state.mode||'post-mnf',targetWeek:state.targetWeek||2,teamMap:state.teamMap||[]};","state={...initialState(),mode:'post-mnf',targetWeek:state.targetWeek||2,teamMap:state.teamMap||[]};")
          old="const note=state.mode==='post-mnf'?'Run after MNF is final. Auto Collect now captures final team scores plus every completed-week lineup, starter/bench designation, and player actual/projection values when Yahoo exposes them.':'Run Thursday after waivers clear. It compares against Tuesday and captures post-waiver rosters, transactions, free agents and Week preview data.';"
          new="const note='Run Wednesday after waivers clear. One collection captures the previous week final results and lineups, current post-waiver rosters and transactions, free agents, standings, and the upcoming week Yahoo projections for the full recap + preview update.';"
          s=s.replace(old,new)
          s=s.replace('>POST-MNF</button>','>WEDNESDAY</button>')
          s=s.replace('.meffl-modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:7px 0}', '.meffl-modes{display:grid;grid-template-columns:1fr;gap:7px;margin:7px 0}.meffl-modes button[data-mode="post-waivers"]{display:none}')
          s=s.replace("${state.mode==='post-mnf'?`recaps W${Math.max(0,(state.targetWeek||1)-1)}`:'preview target'}", "${`recap W${Math.max(0,(state.targetWeek||1)-1)} + preview W${state.targetWeek||1}`}" )
          s=s.replace("['Transactions',tx.length===0||structuredTx===tx.length,`${structuredTx}/${tx.length} structured`]", "['Transactions',tx.length>0&&structuredTx===tx.length,`${structuredTx}/${tx.length} structured`]")

          # Replace the old global transaction parser at the correct top level.
          parser=Path('.github/transaction_parser.js.txt').read_text().rstrip()+"\n\n"
          pattern=r"  function transactionPlayers\(text=''\)\{.*?(?=  function parseFaab\(root=document\)\{)"
          s,n=re.subn(pattern,parser,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit(f'Expected to replace 1 transaction parser block, replaced {n}')

          # Compact any duplicate/partial Yahoo transaction wrappers at merge time.
          old_tx="if(Array.isArray(patch.transactions)&&patch.transactions.length)o.transactions=mergeKeyed(old.transactions,patch.transactions,transactionIdentity);"
          new_tx="if(Array.isArray(patch.transactions)&&patch.transactions.length){const merged=mergeKeyed(old.transactions,patch.transactions,transactionIdentity),groups={};for(const x of merged){const g=(x.team&&x.timestamp)?(x.team+'|'+x.timestamp):('raw|'+transactionIdentity(x));(groups[g]||(groups[g]=[])).push(x)}const compact=[];for(const items of Object.values(groups)){const rich=items.filter(x=>x.type&&x.timestamp&&((x.added||[]).length||(x.dropped||[]).length||x.type==='TRADE'));const src=rich.length?rich:items;const uniq={};for(const x of src){const ps=(x.players||[]).map(p=>String(p.name||'').toLowerCase()+':'+norm(p.action||'')).sort().join(',');const mv=[...(x.added||[]).map(p=>'+'+String(p.name||'').toLowerCase()),...(x.dropped||[]).map(p=>'-'+String(p.name||'').toLowerCase())].sort().join(',');const k=[x.team||'',x.timestamp||'',x.type||'',ps||mv,x.faabSpent??''].join('|');if(!uniq[k])uniq[k]=x}compact.push(...Object.values(uniq))}o.transactions=compact;}"
          s=s.replace(old_tx,new_tx)
          s=s.replace("mode:state.mode,targetWeek:target", "mode:state.mode,workflow:'wednesday-combined',targetWeek:target")
          s=s.replace("const mode=o.mode==='post-mnf'?'POST_MNF':'POST_WAIVERS',name=", "const mode='WEDNESDAY',name=")
          s=s.replace('Clear the current collector workspace? Saved Tuesday/Thursday snapshots stay available for comparison.','Clear the current Wednesday collector workspace?')
          p.write_text(s)
          PY
          cp MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.5.txt
      - name: Syntax check
        run: node --check MEFFL_Weekly_Collector.user.js
      - name: Verify Wednesday mode
        run: |
          grep -q 'MEFFL Weekly Collector — Wednesday' MEFFL_Weekly_Collector.user.js
          grep -q '@version      1.3.5' MEFFL_Weekly_Collector.user.js
          grep -q "workflow:'wednesday-combined'" MEFFL_Weekly_Collector.user.js
          grep -q "const mode='WEDNESDAY'" MEFFL_Weekly_Collector.user.js
          grep -q "tx.length>0&&structuredTx===tx.length" MEFFL_Weekly_Collector.user.js
          grep -q "braddydrinksthebud" MEFFL_Weekly_Collector.user.js
          grep -q "transactionRowRe" MEFFL_Weekly_Collector.user.js
          grep -q "o.transactions=compact" MEFFL_Weekly_Collector.user.js
      - name: Commit collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.5.txt
          if git diff --cached --quiet; then
            echo "Collector already current."
            exit 0
          fi
          git commit -m "Upgrade weekly collector to Wednesday v1.3.5"
          git push
