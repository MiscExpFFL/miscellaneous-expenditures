name: Assemble MEFFL Wednesday Collector
on:
  push:
    paths:
      - '.github/workflows/build-collector.yml'
      - '.github/collector_parts/part01.txt'
      - '.github/collector_parts/activation-smoke.test.cjs'
      - '.github/collector_parts/upgrade-startup-v1312.cjs'
      - '.github/collector_parts/startup-errors.test.cjs'
permissions:
  contents: write
concurrency:
  group: collector-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply source-preserving startup migration
        run: |
          if grep -q '@version      1.3.11' .github/collector_parts/part01.txt; then
            node .github/collector_parts/upgrade-startup-v1312.cjs
          fi
      - name: Build Wednesday collector
        run: |
          cp .github/collector_parts/part01.txt MEFFL_Weekly_Collector.user.js
          cp MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.12.txt
      - name: Syntax check
        run: node --check MEFFL_Weekly_Collector.user.js
      - name: Activation and state-migration smoke tests
        run: node .github/collector_parts/activation-smoke.test.cjs
      - name: Visible startup failures and privacy tests
        run: node .github/collector_parts/startup-errors.test.cjs
      - name: Verify Wednesday contract
        run: |
          grep -q 'MEFFL Weekly Collector — Wednesday' MEFFL_Weekly_Collector.user.js
          grep -q '@version      1.3.12' MEFFL_Weekly_Collector.user.js
          grep -q '@sandbox      DOM' MEFFL_Weekly_Collector.user.js
          grep -q "mode:'WEDNESDAY'" MEFFL_Weekly_Collector.user.js
          grep -q "workflow:'wednesday-combined'" MEFFL_Weekly_Collector.user.js
      - name: Commit verified collector
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/collector_parts/part01.txt .github/collector_parts/activation-smoke.test.cjs MEFFL_Weekly_Collector.user.js MEFFL_Weekly_Collector_v1.3.12.txt
          if git diff --cached --quiet; then
            echo "Collector already current."
            exit 0
          fi
          git commit -m "Build verified MEFFL collector v1.3.12 isolated startup"
          git push
